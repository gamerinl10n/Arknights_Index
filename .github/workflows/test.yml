name: Tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --check web/analytics.js
      - run: node --check web/theme.js
      - run: node --check web/chrome.js
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run format:check
      - run: python -m black --check app.py discovery.py core.py catalog.py search_queries.py search_service.py build.py build_portraits.py portraits.py runtime_snapshot.py scripts/benchmark.py dataset.py translation_alignment.py multilingual_search.py scripts/audit_alignment.py scripts/verify_alignment_snapshot.py
